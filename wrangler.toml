name = "kfz-document-linking"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
[[d1_databases]]
binding = "DB"
database_name = "kfz-document-linking"
database_id = "local-development"
migrations_dir = "migrations"
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[vars]
LLM_ENABLED = "true"
LLM_MAX_CALLS_PER_RUN = "52"
LLM_TIMEOUT_MS = "90000"
LLM_MAX_INPUT_TOKENS = "180000"
LLM_MAX_RUN_MS = "900000"
[env.local.vars]
API_BEARER_TOKEN = "local-development-only-token"
LLM_ENABLED = "true"
LLM_MAX_CALLS_PER_RUN = "52"
LLM_TIMEOUT_MS = "90000"
LLM_MAX_INPUT_TOKENS = "180000"
LLM_MAX_RUN_MS = "900000"
[[env.local.d1_databases]]
binding = "DB"
database_name = "kfz-document-linking"
database_id = "local-development"
migrations_dir = "migrations"
